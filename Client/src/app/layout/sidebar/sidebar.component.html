@if (layout.isSidebarOpen()) {
  <div aria-hidden="true" class="fixed inset-0 z-20 bg-slate-900/45 md:hidden" (click)="layout.closeSidebar()"></div>
}

<aside
  class="fixed inset-y-0 left-0 z-30 flex w-60 flex-none flex-col gap-6 border-r border-line bg-surface px-3 py-3 transition-[width,translate] duration-200 md:relative md:translate-x-0"
  [class.translate-x-0]="layout.isSidebarOpen()"
  [class.-translate-x-full]="!layout.isSidebarOpen()"
  [class.md:w-[68px]]="layout.isSidebarCollapsed()"
>
  <a
    routerLink="/"
    [attr.title]="layout.isSidebarCollapsed() ? 'Starter Kit' : null"
    class="flex h-10 items-center gap-2.5 overflow-hidden rounded-lg px-2 text-[15px] font-semibold whitespace-nowrap text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
  >
    <span
      class="flex size-7 flex-none items-center justify-center rounded-lg bg-primary text-xs text-white"
      aria-hidden="true"
      >SK</span
    >
    @if (!layout.isSidebarCollapsed()) {
      <span>Starter Kit</span>
    }
  </a>

  <nav aria-label="Menu chính" class="flex flex-1 flex-col gap-0.5 overflow-x-hidden overflow-y-auto">
    @for (item of items(); track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="bg-primary-soft text-primary-strong"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
        [attr.title]="layout.isSidebarCollapsed() ? item.label : null"
        (click)="layout.closeSidebar()"
        class="flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm font-medium whitespace-nowrap text-ink-muted hover:bg-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-inset"
      >
        <svg [lucideIcon]="item.icon" aria-hidden="true" class="size-[18px] flex-none"></svg>
        @if (!layout.isSidebarCollapsed()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
