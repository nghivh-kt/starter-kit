<header class="flex h-14 items-center justify-between gap-4 border-b border-line bg-surface px-4 md:px-6">
  <div>
    <button
      type="button"
      aria-label="Mở menu"
      class="flex size-9 items-center justify-center rounded-lg text-ink-muted hover:bg-hover md:hidden focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      (click)="layout.toggleSidebar()"
    >
      <svg lucidePanelLeft aria-hidden="true" class="size-[18px]"></svg>
    </button>
    <button
      type="button"
      [attr.aria-label]="layout.isSidebarCollapsed() ? 'Mở rộng menu' : 'Thu gọn menu'"
      class="hidden size-9 items-center justify-center rounded-lg text-ink-muted hover:bg-hover md:flex focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      (click)="layout.toggleCollapse()"
    >
      <svg lucidePanelLeft aria-hidden="true" class="size-[18px]"></svg>
    </button>
  </div>

  @if (auth.user(); as user) {
    <app-menu [items]="accountActions">
      <span class="flex items-center gap-2.5 p-1 text-sm font-medium text-ink">
        <span
          class="flex size-8 items-center justify-center rounded-full bg-line text-[13px] font-semibold text-ink"
          aria-hidden="true"
          >{{ initial() }}</span
        >
        <span class="hidden sm:inline">{{ user.fullName }}</span>
        <span class="sr-only sm:hidden">{{ user.fullName }}</span>
      </span>
    </app-menu>
  }
</header>
