<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
  <app-input label="Tên danh mục" formControlName="name" />
  <app-input label="Diễn giải" formControlName="description" />
  <app-checkbox formControlName="isActive">Đang hoạt động</app-checkbox>

  <div class="flex flex-row justify-end gap-3">
    <app-button variant="outline" (click)="cancelled.emit()">Huỷ</app-button>
    <app-button type="submit" [loading]="isSaving()">{{ isEdit() ? 'Cập nhật' : 'Thêm mới' }}</app-button>
  </div>
</form>
