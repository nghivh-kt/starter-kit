<app-page-header title="Danh mục" description="Xem, tìm kiếm và quản lý danh mục.">
  @if (canEdit()) {
    <app-button (click)="openForm(null)">
      <svg lucidePlus aria-hidden="true" class="size-4"></svg>
      Thêm danh mục
    </app-button>
  }
</app-page-header>

<app-table
  searchPlaceholder="Tìm theo tên danh mục..."
  [data]="items()"
  [columns]="columns()"
  [loading]="list.isLoading()"
  [searchable]="true"
  [searchValue]="search()"
  [pagination]="true"
  [serverSide]="true"
  [page]="page()"
  [pageSize]="pageSize"
  [totalRecords]="total()"
  [sortKey]="sortBy()"
  [sortDir]="desc() ? 'desc' : 'asc'"
  (searchChange)="navigation.search($event)"
  (pageChange)="navigation.goToPage($event.page)"
  (sortChange)="navigation.sort($event)"
/>

<ng-template #statusTemplate let-category>
  <app-badge [variant]="category.isActive ? 'success' : 'gray'">
    {{ category.isActive ? 'Hoạt động' : 'Tạm ngưng' }}
  </app-badge>
</ng-template>

<ng-template #actionTemplate let-category>
  <app-menu [label]="'Thao tác với ' + category.name" [items]="rowActions(category)" />
</ng-template>

@if (isFormOpen()) {
  <app-modal
    [isOpen]="true"
    [title]="editing() ? 'Cập nhật danh mục' : 'Thêm danh mục'"
    size="lg"
    (closed)="isFormOpen.set(false)"
  >
    <app-category-form [category]="editing()" (saved)="onSaved()" (cancelled)="isFormOpen.set(false)" />
  </app-modal>
}

@if (deleting(); as category) {
  <app-modal [isOpen]="true" title="Xoá danh mục" (closed)="deleting.set(null)">
    <p class="text-sm text-ink">Bạn có chắc muốn xoá danh mục "{{ category.name }}"?</p>
    <div class="mt-5 flex justify-end gap-2">
      <app-button variant="outline" (click)="deleting.set(null)">Huỷ</app-button>
      <app-button variant="danger" [loading]="isDeleting()" (click)="confirmDelete(category)">
        <svg lucideTrash aria-hidden="true" class="size-4"></svg>
        Xoá
      </app-button>
    </div>
  </app-modal>
}
