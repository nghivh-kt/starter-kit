<app-page-header title="Người dùng" description="Quản lý tài khoản, vai trò và trạng thái đăng nhập.">
  <app-button (click)="openForm(null)">
    <svg lucidePlus aria-hidden="true" class="size-4"></svg>
    Thêm người dùng
  </app-button>
</app-page-header>

<app-table
  searchPlaceholder="Tìm theo tên, email..."
  [data]="items()"
  [columns]="columns()"
  [loading]="list.isLoading()"
  [searchable]="true"
  [exportable]="true"
  [exporting]="isExporting()"
  [searchValue]="search()"
  [pagination]="true"
  [serverSide]="true"
  [page]="page()"
  [pageSize]="pageSize()"
  [totalRecords]="total()"
  [sortKey]="sortBy()"
  [sortDir]="desc() ? 'desc' : 'asc'"
  (searchChange)="navigation.search($event)"
  (pageChange)="navigation.goToPage($event.page)"
  (pageSizeChange)="navigation.changePageSize($event)"
  (exportClick)="exportExcel()"
  (sortChange)="navigation.sort($event)"
/>

<ng-template #statusTemplate let-user>
  @if (!user.isActive) {
    <app-badge variant="gray">Đã khoá</app-badge>
  } @else if (isLockedOut(user)) {
    <app-badge variant="warning">Tạm khoá đến {{ user.lockoutEnd | date: 'HH:mm' }}</app-badge>
  } @else {
    <app-badge variant="success">Hoạt động</app-badge>
  }
</ng-template>

<ng-template #roleTemplate let-user>
  <span class="text-ink-muted">{{ roleLabel(user.role) }}</span>
</ng-template>

<ng-template #actionTemplate let-user>
  <app-menu [label]="'Thao tác với ' + user.userName" [items]="rowActions(user)" />
</ng-template>

@if (isFormOpen()) {
  <app-modal
    [isOpen]="true"
    [title]="editing() ? 'Cập nhật người dùng' : 'Thêm người dùng'"
    (closed)="isFormOpen.set(false)"
  >
    <app-user-form [user]="editing()" (saved)="onSaved()" (cancelled)="isFormOpen.set(false)" />
  </app-modal>
}

@if (resetting(); as user) {
  <app-modal [isOpen]="true" title="Đặt lại mật khẩu" (closed)="resetting.set(null)">
    <app-user-reset-password [user]="user" (saved)="resetting.set(null)" (cancelled)="resetting.set(null)" />
  </app-modal>
}
