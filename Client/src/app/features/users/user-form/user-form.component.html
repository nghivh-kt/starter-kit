<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <app-input label="Tên đăng nhập" formControlName="userName" />
  <app-input label="Họ và tên" formControlName="fullName" />
  <app-input label="Email" type="email" formControlName="email" />

  @if (!isEdit()) {
    <app-input label="Mật khẩu" type="password" formControlName="password" />
  }

  <app-select label="Vai trò" [options]="roles" formControlName="role" />

  @if (isEdit()) {
    <app-checkbox formControlName="isActive">Đang hoạt động</app-checkbox>
  }

  <div class="flex justify-end gap-2 pt-1">
    <app-button variant="outline" (click)="cancelled.emit()">Huỷ</app-button>
    <app-button type="submit" [loading]="isSaving()">
      @if (isEdit()) {
        <svg lucideCheck aria-hidden="true" class="size-4"></svg>
        Cập nhật
      } @else {
        <svg lucidePlus aria-hidden="true" class="size-4"></svg>
        Thêm người dùng
      }
    </app-button>
  </div>
</form>
